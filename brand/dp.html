<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hollow Chess — profile picture</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#333; }
  /* Instagram crops profile pictures to a circle — everything meaningful must
     sit well inside the safe circle, so the mark is centred and generously
     inset rather than filling the square. */
  #dp {
    position:relative; width:1080px; height:1080px; overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #1c2029 0%, #14161b 70%);
  }
  #dp .ring {
    position:absolute; inset:36px; border-radius:50%;
    border:6px solid rgba(231,193,74,.28);
  }
  #dp .mark { position:absolute; left:295px; top:150px; width:490px; height:546px; }
  #dp .mark svg { width:100%; height:100%; display:block; }
  #dp .wordmark {
    position:absolute; left:0; right:0; top:740px; text-align:center;
    font-family:'Segoe UI', Arial, sans-serif; font-weight:900;
    font-size:92px; letter-spacing:.04em; color:#e9e9e4; line-height:1.02;
  }
  #dp .wordmark b { color:#e7c14a; font-weight:900; }
</style>
</head>
<body>
  <div id="dp">
    <div class="ring"></div>
    <div class="mark">
      <svg viewBox="0 -0.75 3.6 4.35" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(0.3 0.3)">
          <rect x="0" y="0" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="1" y="0" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <rect x="2" y="0" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="0" y="1" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <!-- the hole: the square that left -->
          <rect x="1.09" y="1.09" width="0.82" height="0.82" fill="none" stroke="#e7c14a"
                stroke-width="0.055" stroke-dasharray="0.16 0.11" rx="0.08"/>
          <rect x="2" y="1" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="0" y="2" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="1" y="2" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <rect x="2" y="2" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <!-- the lifted square, floating, carrying the knight -->
          <g transform="translate(1.62 -0.62)">
            <rect x="0" y="0" width="1" height="1" fill="#e7c14a" rx="0.06"/>
            <g transform="translate(0.06 0.04) scale(0.0196)">
              <path fill="#14161b" d="M14 38 c0 -7 3 -10.5 8.4 -13.7 c-4 1 -7.6 .2 -9 -3.4 c-.6 -1.6 -.3 -3.2 .8 -4.4 l-2.6 2.9 l-2 -2.4 c1 -5.4 5.6 -9.4 11.4 -10.2 c.4 -1.9 2.2 -3 4 -2.2 c2.2 .9 1.9 3.1 1.1 3.9 c4.7 1.2 8.2 5.4 9 11 c.6 4.2 .9 8.7 1 13 .04 1.8 .1 3.5 .1 5.5 z"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div class="wordmark">HOLLOW<b>CHESS</b></div>
  </div>
  <script>window.DP_READY = true;</script>
</body>
</html>
