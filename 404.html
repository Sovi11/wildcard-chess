<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — Hollow Chess</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#14161b; color:#e9e9e4; font-family:system-ui,"Segoe UI",Roboto,sans-serif; }
    .card { text-align:center; padding:40px; }
    .hole { width:120px; height:120px; margin:0 auto 24px; border-radius:14px; background:#101218;
      border:3px dashed #e7c14a; }
    h1 { font-size:26px; margin:0 0 8px; }
    p { color:#969aa1; margin:0 0 24px; }
    a { display:inline-block; padding:12px 24px; border-radius:10px; background:#e7c14a;
      color:#17181c; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hole"></div>
    <h1>This square has been removed</h1>
    <p>Whatever was here is a hole now. That is rather the point of the game.</p>
    <a href="/">Back to the board</a>
  </div>
</body>
</html>
