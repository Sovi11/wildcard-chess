<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hollow Chess — shorts stage</title>
<style>
  :root { --bg:#14161b; --lt:#e9e3d6; --dk:#6f7d92; --accent:#e7c14a; --ink:#e9e9e4; --muted:#969aa1; --danger:#e05656; --ok:#57c974; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--bg);
    font-family:'Segoe UI', Arial, sans-serif; }
  #stage { position:relative; width:1080px; height:1920px; }
  #stage.shake { animation:bigshake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes bigshake {
    10%,90% { transform:translate(-8px,2px) rotate(-.4deg); } 20%,80% { transform:translate(12px,-4px) rotate(.5deg); }
    30%,50%,70% { transform:translate(-16px,6px) rotate(-.7deg); } 40%,60% { transform:translate(16px,-6px) rotate(.6deg); }
  }

  /* camera rig: the board rides on this */
  #cam { position:absolute; inset:0; z-index:1; transform-origin:540px 1050px;
    transition:transform .7s cubic-bezier(.22,1,.36,1); }
  #cam.snap { transition:transform .14s cubic-bezier(.25,1.5,.4,1); }

  .cap {
    position:absolute; left:40px; right:40px; text-align:center; z-index:6;
    font-weight:900; color:var(--ink); line-height:.98; letter-spacing:-.01em;
    text-shadow:0 6px 30px rgba(0,0,0,.95), 0 0 14px rgba(0,0,0,.85);
    opacity:0;
  }
  .cap.top { top:150px; font-size:150px; }
  .cap.mid { top:44%; font-size:170px; }
  .cap.bottom { bottom:130px; font-size:84px; }
  .cap .gold { color:var(--accent); }
  .cap .red { color:var(--danger); }
  .cap .green { color:var(--ok); }
  .cap.show { opacity:1; }
  .cap.slam { animation:slamIn .38s cubic-bezier(.15,1.3,.3,1) forwards; }
  @keyframes slamIn {
    0% { transform:scale(3.4) rotate(-3deg); opacity:0; }
    55% { transform:scale(.92) rotate(.6deg); opacity:1; }
    75% { transform:scale(1.07) rotate(-.3deg); opacity:1; }
    100% { transform:scale(1) rotate(0); opacity:1; }
  }

  #flash { position:absolute; inset:0; z-index:9; pointer-events:none; background:#fff; opacity:0; }
  #vignette { position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0,0,0,.55) 100%); }

  #boardWrap { position:absolute; left:50px; top:560px; width:980px; height:980px; opacity:0; transition:opacity .4s; }
  #boardWrap.show { opacity:1; }
  #board { width:100%; height:100%; display:block; }

  .pc { pointer-events:none; }
  .pc.w { color:#f2ead8; } .pc.b { color:#23252c; }
  .pc.w * { stroke:#26282e; stroke-width:1.1; }
  .pc.b * { stroke:#cfd2d8; stroke-width:.8; }

  #cheese { position:absolute; left:0; right:0; top:42%; text-align:center; font-size:460px; z-index:5;
    opacity:0; transform:scale(.5) rotate(-14deg); transition:opacity .25s, transform .3s cubic-bezier(.2,1.8,.4,1); }
  #cheese.show { opacity:1; transform:scale(1) rotate(0); }

  #counter { position:absolute; top:330px; left:0; right:0; text-align:center; z-index:6;
    font-size:78px; font-weight:900; color:var(--accent); opacity:0; font-variant-numeric:tabular-nums;
    text-shadow:0 4px 20px rgba(0,0,0,.9); }
  #counter.show { opacity:1; }

  #endcard { position:absolute; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:40px; opacity:0; transition:opacity .35s; }
  #endcard.show { opacity:1; }
  #endcard .mark { width:380px; height:440px; }
  #endcard .wm { font-size:150px; font-weight:900; line-height:.85; text-align:center; color:var(--ink); }
  #endcard .wm .l2 { color:var(--accent); }
  #endcard .tag { font-size:46px; color:var(--muted); font-weight:700; }
  #endcard .url { font-size:74px; color:var(--accent); font-weight:900; letter-spacing:.03em; }
  #endcard .free { font-size:42px; color:var(--ink); opacity:.85; font-weight:700; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div id="vignette"></div>
  <div id="cheese">🧀</div>
  <div id="capTop" class="cap top"></div>
  <div id="capMid" class="cap mid"></div>
  <div id="capBottom" class="cap bottom"></div>
  <div id="counter"></div>
  <div id="flash"></div>
  <div id="endcard">
    <div class="mark">
      <svg viewBox="0 -0.75 3.6 4.35" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(0.3 0.3)">
          <rect x="0" y="0" width="1" height="1" fill="#e9e3d6" rx="0.06"/><rect x="1" y="0" width="1" height="1" fill="#6f7d92" rx="0.06"/><rect x="2" y="0" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="0" y="1" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <rect x="1.09" y="1.09" width="0.82" height="0.82" fill="none" stroke="#e7c14a" stroke-width="0.055" stroke-dasharray="0.16 0.11" rx="0.08"/>
          <rect x="2" y="1" width="1" height="1" fill="#e9e3d6" rx="0.06"/>
          <rect x="0" y="2" width="1" height="1" fill="#e9e3d6" rx="0.06"/><rect x="1" y="2" width="1" height="1" fill="#6f7d92" rx="0.06"/><rect x="2" y="2" width="1" height="1" fill="#6f7d92" rx="0.06"/>
          <g transform="translate(1.62 -0.62)">
            <rect x="0" y="0" width="1" height="1" fill="#e7c14a" rx="0.06"/>
            <g transform="translate(0.06 0.04) scale(0.0196)">
              <path fill="#14161b" d="M14 38 c0 -7 3 -10.5 8.4 -13.7 c-4 1 -7.6 .2 -9 -3.4 c-.6 -1.6 -.3 -3.2 .8 -4.4 l-2.6 2.9 l-2 -2.4 c1 -5.4 5.6 -9.4 11.4 -10.2 c.4 -1.9 2.2 -3 4 -2.2 c2.2 .9 1.9 3.1 1.1 3.9 c4.7 1.2 8.2 5.4 9 11 c.6 4.2 .9 8.7 1 13 .04 1.8 .1 3.5 .1 5.5 z"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div class="wm">HOLLOW<br/><span class="l2">CHESS</span></div>
    <div class="tag">the board itself is fair game</div>
    <div class="url">hollowchess.com</div>
    <div class="free">free · in your browser · no download</div>
  </div>
</div>

<script src="../js/engine.js?v=27"></script>
<script src="../js/pieces.js?v=27"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const boardEl = $('board'), wrap = $('boardWrap'), cam = $('cam'), stage = $('stage');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const key = (c, r) => c + ',' + r;

  let game = new Game();
  let overlays = [];
  let lifted = null;
  let flying = null;              // {type,color,fc,fr,tc,tr,e} piece mid-slide
  let holdView = null;
  let curView = null;             // view used by the last render (for cam targeting)

  // ---- beat log for the audio mixer (times in seconds from scene start) ----
  const beats = [];
  let T0 = 0;
  const now = () => (performance.now() - T0) / 1000;
  const vo = (line) => beats.push({ t: now(), vo: line });
  const sfx = (name) => beats.push({ t: now(), sfx: name });

  function view() { const b = game.bounds(); return { minC: b.minC, maxC: b.maxC, minR: b.minR, maxR: b.maxR }; }

  function render() {
    const v = holdView || view();
    curView = v;
    const cols = v.maxC - v.minC + 1, rows = v.maxR - v.minR + 1;
    const M = 0.12;
    boardEl.setAttribute('viewBox', `${-M} ${-M} ${cols + 2 * M} ${rows + 2 * M}`);
    const X = (c) => c - v.minC, Y = (r) => v.maxR - r;
    let svg = pieceDefs('classic');
    for (const k of game.cells) {
      const [c, r] = k.split(',').map(Number);
      const light = (((c + r) % 2) + 2) % 2 === 1;
      svg += `<rect x="${X(c)}" y="${Y(r)}" width="1" height="1" fill="${light ? '#e9e3d6' : '#6f7d92'}"/>`;
    }
    for (const o of overlays) {
      if (o.kind === 'flash') {
        svg += `<rect x="${X(o.c) + .04}" y="${Y(o.r) + .04}" width=".92" height=".92" rx=".1" fill="none" stroke="${o.color}" stroke-width=".09"><animate attributeName="opacity" values="1;.2;1" dur="0.55s" repeatCount="indefinite"/></rect>`;
      }
    }
    for (const [k, p] of game.board) {
      const [c, r] = k.split(',').map(Number);
      if (flying && c === flying.tc && r === flying.tr) continue;   // drawn as ghost below
      svg += `<use href="#pc-classic-${p.type}" x="${X(c)}" y="${Y(r)}" width="1" height="1" class="pc ${p.color === 'white' ? 'w' : 'b'}"/>`;
    }
    for (const o of overlays) {
      if (o.kind === 'beam') {
        const [a, b] = o.pts;
        svg += `<line x1="${X(a[0]) + .5}" y1="${Y(a[1]) + .5}" x2="${X(b[0]) + .5}" y2="${Y(b[1]) + .5}" stroke="#e7c14a" stroke-width=".15" stroke-linecap="round" opacity=".92"/>`;
      }
    }
    if (flying) {
      const fx = X(flying.fc) + (X(flying.tc) - X(flying.fc)) * flying.e;
      const fy = Y(flying.fr) + (Y(flying.tr) - Y(flying.fr)) * flying.e;
      svg += `<use href="#pc-classic-${flying.type}" x="${fx}" y="${fy}" width="1" height="1" class="pc ${flying.color === 'white' ? 'w' : 'b'}"/>`;
    }
    if (lifted) {
      const light = (((lifted.c + lifted.r) % 2) + 2) % 2 === 1;
      svg += `<g opacity="${lifted.alpha}" transform="translate(${lifted.dx} ${lifted.dy})">
        <rect x="${X(lifted.c) + .03}" y="${Y(lifted.r) + .03}" width=".94" height=".94" rx=".05" fill="#0a0b0e" opacity=".45"/>
        <rect x="${X(lifted.c)}" y="${Y(lifted.r) - .12}" width="1" height="1" rx=".05" fill="${light ? '#e9e3d6' : '#6f7d92'}" stroke="#e7c14a" stroke-width=".05"/>
      </g>`;
    }
    boardEl.innerHTML = svg;
  }

  // camera: focus square (c,r) of the CURRENT view at given zoom, with dutch tilt
  function camTo(zoom, rot, focus, snap) {
    cam.classList.toggle('snap', !!snap);
    if (!focus) { cam.style.transform = `scale(${zoom}) rotate(${rot || 0}deg)`; return; }
    const v = curView || view();
    const cols = v.maxC - v.minC + 1, rows = v.maxR - v.minR + 1;
    const M = 0.12, span = Math.max(cols, rows) + 2 * M;
    const px = 980 / span;                                     // board px per square
    const sx = 50 + (980 - (cols + 2 * M) * px) / 2 + (focus[0] - v.minC + .5 + M) * px;
    const sy = 560 + (980 - (rows + 2 * M) * px) / 2 + (v.maxR - focus[1] + .5 + M) * px;
    const dx = 540 - sx, dy = 1050 - sy;
    cam.style.transform = `translate(${dx * zoom}px, ${dy * zoom}px) scale(${zoom}) rotate(${rot || 0}deg)`;
  }
  function camReset(snap) { cam.classList.toggle('snap', !!snap); cam.style.transform = 'none'; }

  function flash(color, ms) {
    const f = $('flash');
    f.style.background = color || '#fff';
    f.style.transition = 'none'; f.style.opacity = .95;
    requestAnimationFrame(() => { f.style.transition = 'opacity ' + (ms || 320) + 'ms ease-out'; f.style.opacity = 0; });
  }
  function shake() { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
  function hit() { flash('#ffffff', 240); shake(); sfx('hit'); }

  function slam(id, html) {
    const el = $(id);
    el.innerHTML = html;
    el.classList.remove('show', 'slam'); void el.offsetWidth;
    el.classList.add('show', 'slam');
    shake();
  }
  function cap(id, html) { const el = $(id); el.innerHTML = html; el.classList.remove('slam'); el.classList.add('show'); }
  function hide(id) { $(id).classList.remove('show', 'slam'); }
  function hideCaps() { ['capTop', 'capMid', 'capBottom'].forEach(hide); }

  // animated frame loop that survives hidden tabs
  function animate(ms, step) {
    const t0 = performance.now();
    return new Promise((done) => {
      let finished = false;
      const frame = (nowMs) => {
        if (finished) return;
        const t = Math.min(1, (nowMs - t0) / ms);
        step(t);
        if (t >= 1) { finished = true; clearInterval(tick); done(); }
        else requestAnimationFrame(frame);
      };
      const tick = setInterval(() => frame(performance.now()), 50);
      requestAnimationFrame(frame);
    });
  }
  const easeInOut = (t) => (t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t);

  async function flySquare(fc, fr, tc, tr, ms) {
    const pre = view();
    holdView = { minC: Math.min(pre.minC, tc), maxC: Math.max(pre.maxC, tc), minR: Math.min(pre.minR, tr), maxR: Math.max(pre.maxR, tr) };
    const ok = game.wildcardMoveCell(fc, fr, tc, tr);
    if (!ok) { holdView = null; render(); return false; }
    sfx('lift');
    await animate(ms || 800, (t) => {
      const e = easeInOut(t);
      lifted = { c: fc, r: fr, dx: (tc - fc) * e, dy: (fr - tr) * e, alpha: 1 };
      render();
    });
    lifted = null; holdView = null;
    render();
    hit();
    return true;
  }

  async function slidePiece(fc, fr, tc, tr, ms) {
    const p = game.get(fc, fr);
    if (!p || !game.makeMove(fc, fr, tc, tr)) return false;
    const moved = game.get(tc, tr);
    await animate(ms || 600, (t) => {
      flying = { type: moved.type, color: moved.color, fc, fr, tc, tr, e: easeInOut(t) };
      render();
    });
    flying = null; render();
    return true;
  }

  async function endCard(holdMs, voLine) {
    hideCaps(); $('counter').classList.remove('show');
    hit();
    $('endcard').classList.add('show');
    if (voLine) vo(voLine);
    sfx('braam');
    await sleep(holdMs || 5200);
    window.SCENE_BEATS = beats;
    window.SCENE_DONE = true;
  }

  async function startScene() {
    // Sync mark for the audio mixer: a SOLID white hold, well after load so the
    // recorder is definitely compositing by then. T0 = the moment it appears.
    await sleep(450);
    const f = $('flash');
    T0 = performance.now();
    beats.push({ t: 0, sync: true });
    f.style.transition = 'none'; f.style.background = '#fff'; f.style.opacity = 1;
    await sleep(180);
    f.style.opacity = 0;
    await sleep(120);
  }

  // =================== ROOK ===================
  async function sceneRook() {
    game.board.clear();
    game._put(0, 0, 'rook', 'white', true);
    game._put(1, 0, 'king', 'white', true);
    game._put(7, 7, 'king', 'black', true);
    game._put(4, 6, 'pawn', 'black', true);
    game.turn = 'white';
    game.rules = { cadence: 1, budget: Infinity, actions: { ac: false, rc: false, mc: true } };
    game._evaluate();
    await startScene();
    wrap.classList.add('show'); render();
    camTo(2.7, -7, [0, 0]);
    await sleep(500);
    slam('capMid', 'THE <span class="gold">ROOK</span>.');
    vo('THE ROOK.'); sfx('braam');
    await sleep(2100);
    hide('capMid');
    cap('capTop', 'eight squares.<br/>one straight line.');
    vo('Eight squares. One straight line. NOTHING stops it.');
    camTo(1.5, -3, [0, 3]);
    await sleep(2600);
    hideCaps();
    // the charge: a1 -> a5, camera chasing
    sfx('whoosh');
    const chase = slidePiece(0, 0, 0, 4, 900);
    camTo(1.9, 2, [0, 4]);
    await chase;
    hit();
    await sleep(350);
    slam('capTop', '<span class="red">UNTIL NOW.</span>');
    vo('Until now.'); sfx('braam');
    // tear a6 out of the file, right in its face
    game.turn = 'black';
    await flySquare(0, 5, 4, 8, 950);
    game.turn = 'white';
    camTo(2.4, -5, [0, 5], true);
    overlays = [{ kind: 'flash', c: 0, r: 4, color: '#e05656' }];
    render();
    await sleep(900);
    hideCaps();
    slam('capMid', 'THE FILE<br/>IS <span class="red">GONE</span>.');
    vo('Even the rook... stops... at the VOID.');
    await sleep(3100);
    hideCaps();
    camReset();
    slam('capTop', 'the board is<br/>the <span class="gold">weapon</span>.');
    await sleep(2200);
    await endCard(5200, 'HOLLOW CHESS. The board is the weapon. Play free at hollow chess dot com.');
  }

  // =================== ISLAND ===================
  // The fortress endgame: the king tears a moat around the corner and lives on
  // a two-square island. Every action here is engine-legal — the bridge really
  // gives check through g7, and burning it really is the only escape.
  async function sceneIsland() {
    game.board.clear();
    game._put(2, 5, 'queen', 'white', true);    // Qc6
    game._put(1, 0, 'king', 'white', true);     // Kb1
    game._put(7, 7, 'king', 'black', true);     // Kh8... starts g8
    game.board.delete(key(7, 7));
    game._put(6, 7, 'king', 'black', true);     // Kg8
    game._put(0, 6, 'pawn', 'black', true);     // a7
    game.turn = 'black';
    game.rules = { cadence: 1, budget: Infinity, actions: { ac: false, rc: false, mc: true } };
    game._evaluate();
    await startScene();
    wrap.classList.add('show'); render();
    overlays = [{ kind: 'flash', c: 6, r: 7, color: '#e05656' }];
    camTo(2.0, 5, [6, 7]);
    render();
    slam('capTop', 'HIS KING<br/>WAS <span class="red">DOOMED</span>.');
    vo('His king... was DOOMED.'); sfx('braam');
    await sleep(2400);
    hideCaps();
    slam('capTop', 'SO HE DID THE<br/><span class="gold">UNTHINKABLE</span>.');
    vo('So he did... the unthinkable.');
    game.turn = 'black';
    await slidePiece(6, 7, 7, 7, 600);          // Kg8 -> h8
    overlays = [];
    await sleep(1200);
    hideCaps();
    cap('capTop', 'he left<br/>the <span class="gold">MAP</span>.');
    vo('He LEFT. The MAP.'); sfx('whoosh');
    camTo(1.5, -3, [6, 6]);
    // tear the moat: h6, g6, g7, g8 fly to the far shore
    const moat = [[7, 5, -1, 2], [6, 5, -1, 3], [6, 6, -1, 4], [6, 7, -1, 5]];
    for (const [a, b, c, d] of moat) {
      game.turn = 'black';
      await flySquare(a, b, c, d, 520);
      await sleep(120);
    }
    hideCaps();
    slam('capMid', 'AN <span class="gold">ISLAND</span>.');
    vo('An ISLAND.'); sfx('braam');
    await sleep(1700);
    hide('capMid');
    // the queen charges and hits the void
    game.turn = 'white';
    sfx('whoosh');
    await slidePiece(2, 5, 5, 5, 700);          // Qc6 -> f6
    overlays = [{ kind: 'beam', pts: [[5, 5], [6, 6]] }];
    render();
    camTo(2.1, 4, [6, 6], true);
    slam('capTop', 'SHE CANNOT<br/><span class="green">TOUCH</span> HIM.');
    vo('She cannot... TOUCH him.');
    await sleep(2500);
    hideCaps();
    // bridge: white drops a square back into g7 — this is CHECK through g7
    slam('capTop', 'SO SHE BUILDS<br/>A <span class="red">BRIDGE</span> —');
    vo('So she builds a BRIDGE.');
    game.turn = 'white';
    await flySquare(-1, 2, 6, 6, 700);
    overlays = [{ kind: 'beam', pts: [[5, 5], [7, 7]] }, { kind: 'flash', c: 7, r: 7, color: '#e05656' }];
    render();
    await sleep(1100);
    hideCaps();
    slam('capTop', 'HE <span class="gold">BURNS</span> IT.');
    vo('He BURNS it.');
    game.turn = 'black';
    await flySquare(6, 6, -1, 6, 550);
    overlays = [{ kind: 'beam', pts: [[5, 5], [6, 6]] }];
    render();
    await sleep(900);
    // again, faster
    game.turn = 'white';
    await flySquare(-1, 3, 6, 6, 380);
    game.turn = 'black';
    await flySquare(6, 6, -1, 7, 380);
    hideCaps();
    slam('capMid', 'FOREVER.');
    vo('Again. And again. FOREVER.'); sfx('braam');
    await sleep(2300);
    hide('capMid');
    camReset();
    overlays = [{ kind: 'flash', c: 7, r: 7, color: '#57c974' }];
    render();
    slam('capTop', '<span class="green">DRAW.</span>');
    cap('capBottom', 'the first <span class="gold">man-made fortress</span> in chess.');
    vo('DRAW. The fortress... HOLDS.');
    await sleep(3000);
    await endCard(5200, 'HOLLOW CHESS. Build your own endgame. Play free at hollow chess dot com.');
  }

  // =================== ESCAPE ===================
  function setupMatePosition() {
    game = new Game();
    game.board.clear();
    game._put(3, 3, 'queen', 'white', true);
    game._put(6, 0, 'rook', 'white', true);
    game._put(0, 6, 'rook', 'white', true);
    game._put(1, 0, 'king', 'white', true);
    game._put(7, 7, 'king', 'black', true);
    game._put(0, 3, 'pawn', 'black', true);
    game.turn = 'black';
    game.moveCount = { white: 1, black: 0 };
    game.epTarget = null;
    game._evaluate();
  }
  async function sceneEscape() {
    setupMatePosition();
    await startScene();
    overlays = [{ kind: 'beam', pts: [[3, 3], [7, 7]] }, { kind: 'flash', c: 7, r: 7, color: '#e05656' }];
    wrap.classList.add('show'); render();
    camTo(2.2, 5, [7, 7]);
    await sleep(450);
    slam('capMid', '<span class="red">CHECKMATE.</span>');
    vo('CHECKMATE.'); sfx('braam');
    await sleep(2000);
    hide('capMid');
    cap('capTop', '…or <span class="gold">is it</span>?');
    vo('Or... is it?');
    camTo(1.25, -2, [5, 5]);
    await sleep(2300);
    hideCaps();
    slam('capTop', 'HE MOVES<br/>THE <span class="gold">FLOOR</span>.');
    vo('He moves... the FLOOR. ITSELF.'); sfx('whoosh');
    await sleep(900);
    overlays = [{ kind: 'flash', c: 7, r: 7, color: '#e05656' }];
    await flySquare(5, 5, 0, 8, 1000);
    overlays = [{ kind: 'beam', pts: [[3, 3], [4, 4]] }, { kind: 'flash', c: 7, r: 7, color: '#57c974' }];
    render();
    camTo(1.8, -4, [5, 5], true);
    await sleep(700);
    hideCaps();
    slam('capMid', '<span class="green">NOT. MATE.</span>');
    vo('The check line? GONE. NOT. MATE.'); sfx('braam');
    await sleep(2900);
    hide('capMid');
    camReset();
    slam('capTop', 'escape the<br/><span class="gold">inescapable</span>.');
    await sleep(2100);
    await endCard(5200, 'HOLLOW CHESS. Escape the inescapable. hollow chess dot com.');
  }

  // =================== CHEESE ===================
  async function sceneCheese() {
    await startScene();
    await sleep(300);
    $('cheese').classList.add('show');
    slam('capTop', 'YOUR CHEESE<br/>HAS <span class="gold">HOLES</span>.');
    vo('Your cheese has holes!'); sfx('hit');
    await sleep(2300);
    $('cheese').classList.remove('show');
    hideCaps();
    slam('capTop', 'DOES YOUR<br/><span class="gold">CHESS</span>?');
    vo('But does your CHESS?'); sfx('braam');
    wrap.classList.add('show'); render();
    camTo(1.15, -2);
    await sleep(1900);
    game.rules = { cadence: 1, budget: Infinity, actions: { ac: false, rc: false, mc: true } };
    game.turn = 'white';
    vo('RIP OUT THE SQUARES. Break the board. Trap the pieces.');
    const moves = [[4, 3, 8, 4], [3, 4, -1, 3], [5, 4, 4, 8], [2, 2, 8, 2], [5, 2, -1, 6]];
    for (const [a, b, c, d] of moves) {
      await flySquare(a, b, c, d, 620);
      game.turn = 'white';
      await sleep(160);
    }
    camTo(1.35, 3, [3, 3], true);
    slam('capBottom', 'holes <span class="red">block</span> bishops.<br/>the board is a <span class="gold">weapon</span>.');
    await sleep(3000);
    camReset();
    await endCard(5200, 'HOLLOW CHESS. Free. In your browser.');
  }

  // =================== MORPH ===================
  function mulberry(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  async function sceneMorph() {
    game.rules = { cadence: 1, budget: Infinity, actions: { ac: false, rc: false, mc: true } };
    await startScene();
    wrap.classList.add('show'); render();
    slam('capTop', 'THIS IS A<br/>CHESS BOARD.');
    vo('This... is a chess board.');
    await sleep(2300);
    hideCaps();
    slam('capMid', '<span class="red">WAS.</span>');
    vo('WAS. A chess board.'); sfx('braam');
    await sleep(1500);
    hide('capMid');
    $('counter').classList.add('show');
    const rand = mulberry(42);
    let applied = 0, delay = 520;
    while (applied < 30) {
      const empties = [...game.cells].filter((k) => !game.board.has(k));
      const src = empties[Math.floor(rand() * empties.length)].split(',').map(Number);
      const targets = [...game._attachTargetsExcluding(key(src[0], src[1]))];
      if (!targets.length) continue;
      const dst = targets[Math.floor(rand() * targets.length)].split(',').map(Number);
      const ok = await flySquare(src[0], src[1], dst[0], dst[1], Math.max(140, delay * .8));
      if (!ok) continue;
      game.turn = rand() < .5 ? 'white' : 'black';
      applied++;
      $('counter').textContent = 'board move ' + applied;
      if (applied === 10) vo('Ten board moves.');
      if (applied === 22) { vo('Where does it END?'); camTo(1.2, -3); }
      delay = Math.max(80, delay * 0.86);
      await sleep(delay * .4);
    }
    await sleep(400);
    $('counter').classList.remove('show');
    camReset();
    slam('capTop', 'STILL <span class="gold">100%</span><br/>LEGAL.');
    vo('Still. One hundred percent. LEGAL.'); sfx('braam');
    cap('capBottom', 'every move validated by the engine.');
    await sleep(3200);
    await endCard(5200, 'HOLLOW CHESS. hollow chess dot com.');
  }

  const scene = new URLSearchParams(location.search).get('scene') || 'rook';
  window.SCENE_DONE = false;
  ({ rook: sceneRook, island: sceneIsland, escape: sceneEscape, cheese: sceneCheese, morph: sceneMorph }[scene] || sceneRook)()
    .catch((e) => { console.error(e); window.SCENE_BEATS = beats; window.SCENE_DONE = true; });
})();
</script>
